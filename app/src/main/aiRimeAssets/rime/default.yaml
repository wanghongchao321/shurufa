# Rime default settings
# encoding: utf-8
config_version: "2026.09.10"

schema_list:
  - schema: t9_pinyin
  - schema: pinyin_full
  - schema: french

punctuator:
  full_shape:
    ",": {commit: "，"}
    ".": {commit: "。"}
    "?": {commit: "？"}
    "!": {commit: "！"}
    ";": {commit: "；"}
    ":": {commit: "："}
    "'": {pair: ["‘", "’"]}
    '"': {pair: ["“", "”"]}
  half_shape:
    ",": {commit: ","}
    ".": {commit: "."}
    "?": {commit: "?"}
    "!": {commit: "!"}
    ";": {commit: ";"}
    ":": {commit: ":"}
    "'": {commit: "'"}
    '"': {commit: '"'}

recognizer:
  patterns:
    email: "^[A-Za-z][-_.0-9A-Za-z]*@.*$"
    url: "^(www[.]|https?:|ftp[.:]|mailto:|file:).*$|^[a-z]+[.].+$"

key_binder:
  bindings:
    - {when: composing, accept: space, send: 1}
    - {when: has_menu, accept: Return, send: 1}
