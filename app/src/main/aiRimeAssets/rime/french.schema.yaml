# Rime schema
# encoding: utf-8

schema:
  schema_id: french
  name: Français
  version: "1.2"
  description: Clavier français QWERTY avec complétion, élisions et dictionnaire embarqué

switches:
  - name: ascii_mode
    reset: 0
    states: [Français, Direct]

engine:
  processors:
    - ascii_composer
    - recognizer
    - key_binder
    - speller
    - punctuator
    - selector
    - navigator
    - express_editor
  segmentors:
    - ascii_segmentor
    - matcher
    - abc_segmentor
    - punct_segmentor
    - fallback_segmentor
  translators:
    - punct_translator
    - table_translator
  filters:
    - uniquifier

speller:
  alphabet: zyxwvutsrqponmlkjihgfedcba
  initials: zyxwvutsrqponmlkjihgfedcba
  max_code_length: 32
  auto_select: false
  delimiter: " '"

translator:
  dictionary: french
  # table_translator does prefix lookup when completion is enabled, so typing
  # "bon" can immediately offer "bonjour" and other French words.
  enable_sentence: false
  enable_encoder: true
  enable_completion: true
  enable_user_dict: true
  initial_quality: 1
  max_phrase_length: 8

menu:
  page_size: 5

punctuator:
  half_shape:
    ",": {commit: ","}
    ".": {commit: "."}
    "?": {commit: "?"}
    "!": {commit: "!"}
    ";": {commit: ";"}
    ":": {commit: ":"}
    "'": {commit: "'"}
    '"': {commit: '"'}
    "-": {commit: "-"}

key_binder:
  bindings:
    - {when: has_menu, accept: space, send: 1}
    - {when: has_menu, accept: Return, send: 1}

recognizer:
  patterns: {}
