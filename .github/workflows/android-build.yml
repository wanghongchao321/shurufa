name: Build Android IME

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable

      - name: Test backend
        working-directory: backend
        run: |
          pnpm install --frozen-lockfile
          pnpm test

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Prepare artifact
        run: cp app/build/outputs/apk/debug/app-debug.apk VoiceTranslateIme-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VoiceTranslateIme-debug-apk
          path: VoiceTranslateIme-debug.apk
          if-no-files-found: error
          retention-days: 30
