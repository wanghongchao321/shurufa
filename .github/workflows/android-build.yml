name: Build Android IME

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        id: android-build
        continue-on-error: true
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          set -o pipefail
          BUILD_API_KEY="${OPENROUTER_API_KEY:-compile-check-placeholder}"
          gradle --no-daemon --stacktrace \
            -POPENROUTER_API_KEY="$BUILD_API_KEY" \
            :app:assembleDebug 2>&1 | tee gradle-build.log

      - name: Report Android build failure
        if: steps.android-build.outcome == 'failure'
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          lines = Path("gradle-build.log").read_text(errors="replace").splitlines()
          useful = [
              line for line in lines
              if line.startswith(("e: ", "FAILURE:", "* What went wrong:"))
              or " error: " in line
              or "Execution failed for task" in line
              or "AndroidManifest.xml" in line
              or "manifest merger" in line.lower()
              or "uses-sdk" in line
              or "AAPT:" in line
              or "attribute " in line.lower()
              or "not found" in line.lower()
          ][-40:]

          def escape(value):
              return value.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")

          for line in useful or lines[-20:]:
              print(f"::error::{escape(line)}")

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write("## Android build failure\n\n```text\n")
              summary.write("\n".join(lines[-120:]))
              summary.write("\n```\n")
          PY
          exit 1

      - name: Require OpenRouter API key
        if: steps.android-build.outcome == 'success'
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          if [ -z "$OPENROUTER_API_KEY" ]; then
            echo "::error::Add the repository secret OPENROUTER_API_KEY, then rerun this workflow."
            exit 1
          fi

      - name: Prepare artifact
        run: cp app/build/outputs/apk/debug/app-debug.apk VoiceTranslateIme-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VoiceTranslateIme-debug-apk
          path: VoiceTranslateIme-debug.apk
          if-no-files-found: error
          retention-days: 30
