name: Build and Test APK

on:
  push:
    branches:
      - main
      - dev*
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  checks: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0
        
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'
          
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        
      - name: Install NDK
        run: |
          sdkmanager "ndk;29.0.14206865"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865" >> $GITHUB_ENV
          echo "ANDROID_NDK=$ANDROID_HOME/ndk/29.0.14206865" >> $GITHUB_ENV
        
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build
          
      - name: Cache native deps
        uses: actions/cache@v6
        with:
          path: |
            app/src/main/jni/onnxruntime
            app/src/main/jniLibs/**/libonnxruntime.so
          key: native-${{ runner.os }}-${{ hashFiles('app/build-logic/tasks-native.gradle.kts') }}
          restore-keys: |
            native-${{ runner.os }}-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Download native deps (ONNX Runtime)
        run: ./gradlew downloadOnnx --no-daemon
        
      - name: Cache CMake build
        uses: actions/cache@v6
        with:
          path: |
            app/.cxx
            app/src/main/jni/boost
            app/src/main/jni/boost-*.tar.xz
          key: cmake-${{ runner.os }}-${{ hashFiles('app/src/main/jni/CMakeLists.txt') }}
          restore-keys: |
            cmake-${{ runner.os }}-
            
      - name: Run Unit Tests
        id: unit-tests
        continue-on-error: true
        run: |
          set -o pipefail
          ./gradlew :app:testDebugUnitTest :plugin-core:testDebugUnitTest --no-daemon \
            2>&1 | tee gradle-test.log
        
      - name: Generate Test Report
        if: always()
        uses: mikepenz/action-junit-report@v6
        with:
          report_paths: '**/build/test-results/testDebugUnitTest/*.xml'
          fail_on_failure: true
          
      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-results
          path: app/build/test-results/testDebugUnitTest/
          retention-days: 7

      - name: Report test or compilation failure
        if: steps.unit-tests.outcome == 'failure'
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          lines = Path("gradle-test.log").read_text(errors="replace").splitlines()
          useful = [
              line for line in lines
              if line.startswith(("e: ", "FAILURE:", "* What went wrong:"))
              or " error: " in line
              or "Execution failed for task" in line
              or "Unresolved reference" in line
              or "Compilation error" in line
              or "CMake Error" in line
          ][-60:]

          def escape(value):
              return value.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")

          for line in useful or lines[-40:]:
              print(f"::error::{escape(line)}")

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write("## Gradle failure\n\n```text\n")
              summary.write("\n".join(lines[-160:]))
              summary.write("\n```\n")
          PY
          exit 1
          
      - name: Build Debug APKs
        env:
          OPENROUTER_API_KEY: ${{ secrets.SHURUFA }}
        run: |
          if [ -z "$OPENROUTER_API_KEY" ]; then
            echo "::error::Add the repository secret SHURUFA, then rerun this workflow."
            exit 1
          fi
          ./gradlew assembleDebug --no-daemon \
            -POPENROUTER_API_KEY="$OPENROUTER_API_KEY"

      - name: Upload Debug APKs
        uses: actions/upload-artifact@v7
        with:
          name: FeizhouWangIme-Xime-arm64-v8a-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30
